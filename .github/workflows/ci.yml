name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/magictrip_ci
      SECRET_KEY: ci-only-secret-never-use-in-production-123456
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      GEMINI_API_KEY: ci-placeholder-not-a-real-key
      GOOGLE_WEATHER_ENABLED: "false"
      GOOGLE_PLACES_ENABLED: "false"
      GOOGLE_ROUTES_ENABLED: "false"
      GOOGLE_GEOCODING_ENABLED: "false"
      GOOGLE_TRANSIT_FARES_ENABLED: "false"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: magictrip_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d magictrip_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply migrations to a fresh PostgreSQL database
        run: python -m alembic upgrade head
      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deployment-checks:
    name: Deployment scripts and workflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test deployment failure handling without cloud access
        run: python -m unittest discover -s scripts/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Vercel production configuration validation
        run: node --test scripts/tests/check-vercel.test.mjs
      - name: Validate GitHub Actions syntax and shell scripts
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Verify backend container builds
        run: docker build --tag magictrip-backend:ci Backend
