name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize the entire release, including its checks. Never cancel a migration
# or an in-flight release just because a newer commit arrives.
concurrency:
  group: magictrip-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Release Azure and Vercel
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: ${{ vars.FRONTEND_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_API_APP_NAME: ${{ vars.AZURE_API_APP_NAME }}
      AZURE_WORKER_APP_NAME: ${{ vars.AZURE_WORKER_APP_NAME }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      VERCEL_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      AZURE_CORE_OUTPUT: none
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate required configuration
        shell: bash
        run: |
          required=(AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID
            AZURE_RESOURCE_GROUP AZURE_ACR_NAME AZURE_API_APP_NAME
            AZURE_WORKER_APP_NAME VERCEL_ORG_ID VERCEL_PROJECT_ID
            VERCEL_TOKEN FRONTEND_URL)
          missing=0
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing $name. See docs/CI_CD.md."
              missing=1
            fi
          done
          exit "$missing"
      - name: Reject a superseded main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "::error::This commit is no longer main. Run the workflow on current main."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --only-show-errors
      - name: Inspect Azure deployment targets
        run: python scripts/deploy.py preflight
      - name: Install Vercel CLI
        run: npm install --global vercel@59.11.7
      # Run from the repository root: the linked Vercel project has Root Directory=Frontend.
      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Check Vercel project root and backend connection
        run: node --env-file=.vercel/.env.production.local scripts/check-vercel.mjs
      - name: Build Vercel production artifact before changing Azure
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Sign in to the container registry
        run: az acr login --name "$AZURE_ACR_NAME" --only-show-errors
      - uses: docker/setup-buildx-action@v3
      - name: Build and push backend release image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: Backend
          platforms: linux/amd64
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/magictrip-backend:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Deploy API and wait for its new revision and database
        env:
          RELEASE_IMAGE: ${{ env.ACR_LOGIN_SERVER }}/magictrip-backend@${{ steps.image.outputs.digest }}
        run: python scripts/deploy.py api
      - name: Deploy and verify worker revision
        env:
          RELEASE_IMAGE: ${{ env.ACR_LOGIN_SERVER }}/magictrip-backend@${{ steps.image.outputs.digest }}
        run: python scripts/deploy.py worker
      - name: Deploy the prebuilt frontend to Vercel production
        run: |
          deployment_url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          printf 'Vercel deployment: %s\n' "$deployment_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke-test the production frontend and its backend proxy
        run: python scripts/deploy.py smoke
      - name: Record successful release
        env:
          RELEASE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Commit: `%s`\n\nBackend image: `%s/magictrip-backend@%s`\n' \
            "$GITHUB_SHA" "$ACR_LOGIN_SERVER" "$RELEASE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
